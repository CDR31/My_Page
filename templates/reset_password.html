<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <!-- Student Service Portal Favicon -->
<link rel="icon"
      type="image/png"

      href="{{ url_for('static', filename='images/favicon.png') }}?v=3">

<body>

<h1>🔑 Create New Password</h1>

<form method="POST">

        type="password"
        name="password"
        placeholder="New Password"
        required>

    <button type="submit">
        Save Password
    </button>

</form>

</body>
</html>
