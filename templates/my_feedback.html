<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Feedback - Student Service Portal</title>

    <!-- Student Service Portal Favicon -->
    <link rel="icon"
          type="image/png"
          href="{{ url_for('static', filename='images/favicon.png') }}?v=5">

    <!-- Your CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <a href="/dashboard" class="btn page-top-btn">
        🏠 Dashboard
    </a>

    <br><br>

    <h1>My Feedback</h1>

    {% for feedback in feedbacks %}

    <div class="project-card">

        <h3>📝 Your Feedback</h3>

        <p>
            {{ feedback.message }}
        </p>

        <hr>

        <h3>💬 Admin Reply</h3>

        <p>
            {{ feedback.reply if feedback.reply else "No reply yet" }}
        </p>

    </div>

    {% endfor %}

</body>
</html>
