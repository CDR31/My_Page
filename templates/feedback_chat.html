<h1>Feedback Conversation</h1>
<!-- Student Service Portal Favicon -->
<link rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/favicon.png') }}?v=5">

{% for msg in messages %}

<p>

<strong>{{ msg.sender }}</strong>

:

{{ msg.message }}

</p>

<hr>

{% endfor %}

<form method="POST"
action="/user_reply/{{ feedback.id }}">

<textarea
name="message">
</textarea>

<button type="submit">

Send

</button>

</form>
