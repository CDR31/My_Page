<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Feedback - Student Service Portal</title>

<!-- Student Service Portal Favicon -->
<link rel="icon"
      type="image/png"
      sizes="64x64"
      href="{{ url_for('static', filename='images/favicon.png') }}?v=6">

<!-- Custom CSS -->
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<a href="/dashboard" class="btn page-top-btn">
    🏠 Dashboard
</a>

<hr>

<div class="form-container">

    <div class="form-card">

        <h1>📝 Feedback</h1>

        <p class="subtitle">
            Share your suggestions, issues, or ideas to improve the platform.
        </p>

        <form method="POST">

            <textarea
                name="message"
                placeholder="Write your feedback here..."
                rows="6"
                required>
            </textarea>

            <br><br>

            <button type="submit">
                Send Feedback
            </button>

        </form>

    </div>

</div>

</body>
</html>
