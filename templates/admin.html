<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - Student Service Portal</title>

<!-- Student Service Portal Favicon -->
<link rel="icon"
      type="image/png"
      sizes="64x64"
      href="{{ url_for('static', filename='images/favicon.png') }}?v=6">

<!-- Main CSS -->
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">


</head>

<body>

<a href="/dashboard" class="btn btn-top-btn">
    🏠 Dashboard
</a>

<br><br>

<section class="hero-banner">

    <h1>🛠 Admin Dashboard</h1>

    <p>
        Manage users, projects and feedback.
    </p>

</section>

<div class="dashboard-stats">

    <div class="project-card">
        <h3>👥 Users</h3>
        <p>{{ users|length }}</p>
    </div>

    <div class="project-card">
        <h3>📁 Projects</h3>
        <p>{{ projects|length }}</p>
    </div>

    <div class="project-card">
        <h3>📝 Feedback</h3>
        <p>{{ feedbacks|length }}</p>
    </div>

</div>

</body>
</html>
