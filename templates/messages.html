<!DOCTYPE html>
<html>
<head>

    <title>Messages</title>
    <!-- Student Service Portal Favicon -->
<link rel="icon"
      type="image/png"
      sizes="64x64"
      href="{{ url_for('static', filename='images/favicon.png') }}?v=3">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>
    <a href="/dashboard" class="btn page-top-btn">
    🏠 Dashboard
    </a>

    <hr>
    
<div class="container">

    <h1 class="mt-5 mb-5">
        Contact Messages
    </h1>

    {% for message in messages %}

    <div class="project-card">

        <h3>{{ message.name }}</h3>

        <p>
            {{ message.email }}
        </p>

        <p>
            {{ message.message }}
        </p>

    </div>

    {% endfor %}

</div>

</body>
</html>
