<!DOCTYPE html>
<html>
<head>
    <title>{{ user.name }}</title>
    <!-- Student Service Portal Favicon -->
<link rel="icon"
      type="image/png"
      sizes="64x64"
      href="{{ url_for('static', filename='images/favicon.png') }}?v=3">
</head>


<body>

    

<h1>{{ user.name }}</h1>

{% if user.profile_photo %}

<img
src="{{ url_for(
'static',
filename='profile_photos/' + user.profile_photo
) }}"
width="200">

{% endif %}

<p>

Email:
{{ user.email }}

</p>

</body>

</html>
